name: SOAR Threat Detection and Response

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run threat detection engine
        run: python soar_engine.py

      - name: Run incident response playbooks
        run: python response_playbooks.py

      - name: Validate detection and response reports
        run: |
          python - <<'PY'
          import json

          with open("incident_report.json", encoding="utf-8") as file:
              incidents = json.load(file)

          with open("response_report.json", encoding="utf-8") as file:
              responses = json.load(file)

          assert incidents["total_events"] == 13
          assert incidents["total_incidents"] == 2
          assert responses["total_responses"] == 2

          assert sorted(
              item["severity"] for item in incidents["incidents"]
          ) == ["CRITICAL", "HIGH"]

          assert all(
              item["containment_executed"] is False
              and item["approval_required"] is True
              for item in responses["responses"]
          )

          print("Validation passed: 13 events, 2 incidents, 2 playbooks")
          PY

      - name: Upload SOAR reports
        uses: actions/upload-artifact@v4
        with:
          name: soar-security-reports
          path: |
            incident_report.json
            response_report.json
          if-no-files-found: error

